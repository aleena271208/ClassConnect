services:

  - type: web

    name: classconnect

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:

      - key: SECRET_KEY

        generateValue: true

      - key: DATABASE_URL

        fromDatabase:

          name: classconnect-db

          property: connectionString


databases:

  - name: classconnect-db